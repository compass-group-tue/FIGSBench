# vLLM settings of the GLM-5.3-Flash judge server used for the paper.
# H100 single-node FP8 weights, BF16 KV (Hopper does not support FP8 KV for this model per vLLM recipe).
tensor_parallel_size: 8
max_model_len: 98304
gpu_memory_utilization: 0.85
max_num_seqs: 64
max_num_batched_tokens: 32768
kv_cache_dtype: auto
enable_expert_parallel: true
tool_call_parser: glm47
reasoning_parser: glm45
trust_remote_code: true
use_docker: true
docker_image: figsbench-judge:glm-5.3-flash
vllm_extra_args: ["--enable-prefix-caching", "--served-model-name", "zai-org/GLM-5.3-Flash"]
