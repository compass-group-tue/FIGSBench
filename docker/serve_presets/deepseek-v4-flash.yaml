# vLLM settings of the DeepSeek-V4-Flash user-simulator server used for the paper.
hf_repo: deepseek-ai/DeepSeek-V4-Flash
tensor_parallel_size: 8
max_model_len: 16384
gpu_memory_utilization: 0.92
max_num_seqs: 256
max_num_batched_tokens: 16384
block_size: 256
kv_cache_dtype: fp8
enable_expert_parallel: true
tokenizer_mode: deepseek_v4
tool_call_parser: deepseek_v4
reasoning_parser: deepseek_v4
trust_remote_code: true
use_docker: true
docker_image: figsbench-user-simulator:deepseek-v4-flash
vllm_extra_args: ["--optimization-level", "3", "--no-enable-prefix-caching", "-cc.cudagraph_mode=FULL_DECODE_ONLY"]
description: DeepSeek-V4-Flash MoE FP4/FP8, breakable cudagraph, CUDA compat
