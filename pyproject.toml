[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "figsbench"
version = "1.0.0"
description = "FIGS: Evaluating Multi-Turn Sycophancy Without Penalizing Empathy"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "DATA_LICENSE.md"]
authors = [{name = "The FIGS Authors"}]
keywords = ["FIGS", "benchmark", "language-models", "evaluation", "sycophancy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
figsbench-validate = "figsbench.validate:main"
figsbench-score = "figsbench.metrics:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
figsbench = [
  "data/*.json",
  "data/example_seeds/*",
  "prompts/*/*.txt",
  "prompts/*/*.json",
  "prompts/*/*/*.txt",
  "prompts/*/*/*/*.txt",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
