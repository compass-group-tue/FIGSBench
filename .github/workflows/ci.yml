name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate release schemas, locks, and checksums
        run: sycbench-validate .
      - name: Run tests
        run: pytest -q
      - name: Reproduce authoring plan (no API calls)
        run: python -m archetype_guided_benchmark.run_final --dry-run --seed-corpus code/source_corpus/data/example-seeds-v1/seeds.jsonl
      - name: Verify checksum files independently
        run: |
          sha256sum --check MANIFEST.sha256
          (cd prompts && sha256sum --check SHA256SUMS)
