name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate data and judge prompt locks
        run: figsbench-validate .
      - name: Run tests
        run: pytest -q
      - name: Reproduce authoring plan (no API calls)
        run: python -m figsbench.generation --dry-run --seed-corpus src/figsbench/data/example_seeds/seeds.jsonl --output-dir /tmp/figs-dry-run
